{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawa Bike Rental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #d63031;
            --secondary: #2d3436;
            --light: #f5f6fa;
            --dark: #2d3436;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .bike-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .image-section {
            position: relative;
            height: 400px;
            overflow: hidden;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-section:hover img {
            transform: scale(1.05);
        }

        .bike-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            font-weight: 500;
        }

        .info-section {
            padding: 30px;
            background: linear-gradient(to bottom, #ffffff, #f8f9fa);
        }

        .bike-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .price-tag {
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 25px;
        }

        .feature-list {
            list-style: none;
            padding: 0;
            margin-bottom: 30px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px;
            background: var(--light);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            transform: translateX(5px);
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .feature-item i {
            color: var(--primary);
            margin-right: 15px;
            font-size: 1.2rem;
        }

        .time-select {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ddd;
            width: 200px;
            margin-left: 10px;
            font-size: 0.9rem;
        }

        .location-options {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .location-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--light);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .location-option:hover {
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .rent-button {
            display: inline-block;
            padding: 15px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .rent-button:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.3);
        }

        @media (max-width: 768px) {
            .image-section {
                height: 300px;
            }

            .bike-title {
                font-size: 2rem;
            }

            .price-tag {
                font-size: 1.5rem;
            }

            .location-options {
                flex-direction: column;
            }

            .info-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bike-card">
            <div class="image-section">
                <img src="perimg/jawa.webp" alt="Jawa Bike">
                <span class="bike-badge">Available Now</span>
            </div>
            <div class="info-section">
                <h1 class="bike-title">Jawa Classic</h1>
                <div class="price-tag">₹2,200/day</div>
                
                <ul class="feature-list">
                    <li class="feature-item">
                        <i class="fas fa-motorcycle"></i>
                        <span>300cc Classic Retro Bike</span>
                    </li>
                    <li class="feature-item">
                        <i class="fas fa-clock"></i>
                        <span>Duration:
                            <select class="time-select">
                                <option value="24h">24 Hours</option>
                                <option value="12h">12 Hours</option>
                                <option value="2d">2 Days</option>
                                <option value="3d">3 Days</option>
                                <option value="4d">4 Days</option>
                            </select>
                        </span>
                    </li>
                    <li class="feature-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <div class="location-options">
                            <label class="location-option">
                                <input type="radio" name="location" value="bhavnagar">
                                <span>Bhavnagar</span>
                            </label>
                            <label class="location-option">
                                <input type="radio" name="location" value="ahmedabad">
                                <span>Ahmedabad</span>
                            </label>
                        </div>
                    </li>
                </ul>

                <button class="rent-button">
                    <i class="fas fa-key"></i> Rent Now
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% include 'core/footer.html' %}
</body>
</html>
