{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Rentify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .payment-form {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .payment-method {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }
        .payment-method.selected {
            border-color: #007bff;
            background-color: #f0f7ff;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="payment-form">
            <h2 class="text-center mb-4">Payment Details</h2>
            
            <div class="alert alert-info">
                Total Amount to Pay: ₹
            </div>

            <form id="paymentForm" onsubmit="return processPayment(event)">
                <div class="mb-3">
                    <label class="form-label">Select Payment Method:</label>
                    
                    <div class="payment-method" onclick="selectPaymentMethod('upi')">
                        <input type="radio" name="payment_method" value="upi" required>
                        <label>UPI Payment</label>
                    </div>
                    
                    <div class="payment-method" onclick="selectPaymentMethod('card')">
                        <input type="radio" name="payment_method" value="card" required>
                        <label>Credit/Debit Card</label>
                    </div>
                    
                    <div class="payment-method" onclick="selectPaymentMethod('cash')">
                        <input type="radio" name="payment_method" value="cash" required>
                        <label>Cash on Delivery</label>
                    </div>
                </div>

                <div id="upi-details" style="display: none;">
                    <div class="mb-3">
                        <label class="form-label">UPI ID</label>
                        <input type="text" class="form-control" name="upi_id" placeholder="Enter your UPI ID">
                    </div>
                </div>

                <div id="card-details" style="display: none;">
                    <div class="mb-3">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control" name="card_number" placeholder="1234 5678 9012 3456">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Expiry Date</label>
                            <input type="text" class="form-control" name="expiry" placeholder="MM/YY">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">CVV</label>
                            <input type="text" class="form-control" name="cvv" placeholder="123">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Pay Now</button>
            </form>
        </div>
    </div>

    <script>
    function selectPaymentMethod(method) {
        // Hide all payment details sections
        document.getElementById('upi-details').style.display = 'none';
        document.getElementById('card-details').style.display = 'none';
        
        // Show selected method details
        if (method === 'upi') {
            document.getElementById('upi-details').style.display = 'block';
        } else if (method === 'card') {
            document.getElementById('card-details').style.display = 'block';
        }
        
        // Update radio button
        document.querySelector(`input[value="${method}"]`).checked = true;
        
        // Update selected styles
        document.querySelectorAll('.payment-method').forEach(elem => {
            elem.classList.remove('selected');
        });
        document.querySelector(`input[value="${method}"]`).closest('.payment-method').classList.add('selected');
    }

    function processPayment(event) {
        event.preventDefault();
        
        // Here you would normally process the payment with a payment gateway
        // For demo purposes, we'll just show a success message
        alert('Payment processed successfully! Your rental items have been booked.');
        
        // Clear cart and redirect to confirmation page
        fetch('clear_cart.php', {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.href = 'confirmation.php';
            }
        });
        
        return false;
    }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% include 'core/footer.html' %}
</body>
</html>
