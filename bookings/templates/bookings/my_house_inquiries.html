{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My House Inquiries - Rentify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .inquiry-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .inquiry-card:hover { transform: translateY(-5px); }
        .inquiry-header {
            background: #1a237e;
            color: white;
            padding: 15px 20px;
        }
        .inquiry-body { padding: 20px; }
        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-contacted {
            background-color: #cce5ff;
            color: #004085;
        }
        .status-booked {
            background-color: #d4edda;
            color: #155724;
        }
        .status-cancelled {
            background-color: #f8d7da;
            color: #721c24;
        }
        .status-message {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .status-message.pending {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .status-message.contacted {
            background-color: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }
        .status-message.booked {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-message.cancelled {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status-message i { margin-right: 8px; }
        .detail-item { margin-bottom: 10px; }
        .detail-item i {
            width: 25px;
            color: #1a237e;
        }
        .no-inquiries {
            text-align: center;
            padding: 40px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }
        .no-inquiries i {
            font-size: 3rem;
            color: #1a237e;
            margin-bottom: 20px;
        }
        .house-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My House Inquiries</h2>
            <a href="/properties/houses/" class="btn btn-outline-primary">
                <i class="fas fa-arrow-left"></i> Back to Houses
            </a>
        </div>

        
            
                <div class="inquiry-card">
                    <div class="inquiry-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1"></h5>
                                <div class="text-white-50">
                                    <i class="fas fa-map-marker-alt"></i> 
                                    
                                </div>
                                <div class="text-white-50 mt-1">
                                    <i class="fas fa-rupee-sign"></i> 
                                    /month
                                </div>
                            </div>
                            <span class="status-badge status-">
                                
                            </span>
                        </div>
                    </div>
                    <div class="inquiry-body">
                        <div class="row">
                            <div class="col-md-4">
                                <img src="{% static 'images/image/houseimg/i1.jpg' %}" class="house-image" alt="">
                                
                                    <div class="status-message ">
                                        
                                    </div>
                                
                            </div>
                            <div class="col-md-8">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="detail-item">
                                            <i class="fas fa-user"></i>
                                            <strong>Name:</strong> 
                                            
                                        </div>
                                        <div class="detail-item">
                                            <i class="fas fa-phone"></i>
                                            <strong>Phone:</strong> 
                                            
                                        </div>
                                        <div class="detail-item">
                                            <i class="fas fa-envelope"></i>
                                            <strong>Email:</strong> 
                                            
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        
                                        <div class="detail-item">
                                            <i class="fas fa-file-alt"></i>
                                            <strong>Requirements:</strong><br>
                                            
                                        </div>
                                        
                                        <div class="detail-item">
                                            <i class="fas fa-calendar-alt"></i>
                                            <strong>Inquiry Date:</strong><br>
                                            
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            
        
            <div class="no-inquiries">
                <i class="fas fa-home mb-3"></i>
                <h3>No Inquiries Yet</h3>
                <p class="text-muted">You haven't made any house inquiries yet.</p>
                <a href="/properties/houses/" class="btn btn-primary">Browse Houses</a>
            </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% include 'core/footer.html' %}
</body>
</html>
