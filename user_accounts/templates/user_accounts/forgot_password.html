{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Forgot Password - Rentify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3c72 50%, #2a5298 100%);
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        .back-to-home {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.12);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .back-to-home:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #f39c12;
            transform: translateX(-3px);
        }

        .forgot-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            animation: containerAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-section img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            animation: logoFloat 3s ease-in-out infinite alternate;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .subtitle-text {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 44px 14px 40px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-wrapper input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        .input-wrapper input.is-valid-field {
            border-color: #4ade80 !important;
        }

        .input-wrapper input.is-invalid-field {
            border-color: #f87171 !important;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
        }

        .field-icon {
            position: absolute;
            left: 14px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            pointer-events: none;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #f39c12;
        }

        .field-error-msg {
            display: block;
            color: #f87171;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
            min-height: 18px;
            transition: all 0.2s ease;
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.35);
        }

        .reset-btn:hover {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(243, 156, 18, 0.5);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
        }

        .login-link a {
            color: #f39c12;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .login-link a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .forgot-container {
                padding: 28px 20px;
            }
            .back-to-home {
                top: 12px;
                left: 12px;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-to-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="forgot-container">
        <!-- Floating Logo Header Section -->
        <div class="logo-section">
            <img src="{% static 'images/image/logo.webp' %}" alt="Rentify Logo" onerror="this.src='https://via.placeholder.com/85/1e3c72/ffffff?text=Rentify'">
            <h2>Forgot Password</h2>
            <p class="subtitle-text">Enter your registered email to reset your account password</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'danger' }}" style="background: rgba(239, 68, 68, 0.25); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ef4444; font-size: 14px;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <div id="forgot-error-alert" style="display:none; background: rgba(239, 68, 68, 0.25); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ef4444; font-size: 14px;"></div>
        <div id="forgot-success-alert" style="display:none; background: rgba(34, 197, 94, 0.25); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #22c55e; font-size: 14px;"></div>

        <form id="forgot-form" method="POST" action="/accounts/forgot-password/" novalidate>
            {% csrf_token %}
            
            <!-- Email Address -->
            <div class="input-group">
                <label for="email">Registered Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope field-icon"></i>
                    <input type="email" id="email" name="email" placeholder="e.g. rahul@example.com" required autocomplete="email">
                </div>
                <span class="field-error-msg" id="error-email"></span>
            </div>

            <!-- New Password -->
            <div class="input-group">
                <label for="new_password">New Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock field-icon"></i>
                    <input type="password" id="new_password" name="new_password" placeholder="Min 6 chars, letters & numbers" required autocomplete="new-password">
                    <i class="fas fa-eye password-toggle" onclick="togglePasswordVisibility('new_password', this)"></i>
                </div>
                <span class="field-error-msg" id="error-new_password"></span>
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-shield-alt field-icon"></i>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required autocomplete="new-password">
                    <i class="fas fa-eye password-toggle" onclick="togglePasswordVisibility('confirm_password', this)"></i>
                </div>
                <span class="field-error-msg" id="error-confirm_password"></span>
            </div>

            <button type="submit" class="reset-btn" id="resetBtn">Reset Password</button>

            <div class="login-link">
                Remembered your password? <a href="/accounts/login/">Back to Login</a>
            </div>
        </form>
    </div>

    <script>
        function togglePasswordVisibility(inputId, icon) {
            const passwordInput = document.getElementById(inputId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ================= REAL-TIME INLINE FIELD VALIDATIONS =================
        const emailInput = document.getElementById('email');
        const newPasswordInput = document.getElementById('new_password');
        const confirmPasswordInput = document.getElementById('confirm_password');

        function validateEmail() {
            const val = emailInput.value.trim();
            const errElem = document.getElementById('error-email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!val) {
                emailInput.classList.add('is-invalid-field');
                emailInput.classList.remove('is-valid-field');
                errElem.textContent = 'Email address is required.';
                return false;
            } else if (!emailRegex.test(val)) {
                emailInput.classList.add('is-invalid-field');
                emailInput.classList.remove('is-valid-field');
                errElem.textContent = 'Please enter a valid email address.';
                return false;
            } else {
                emailInput.classList.remove('is-invalid-field');
                emailInput.classList.add('is-valid-field');
                errElem.textContent = '';
                return true;
            }
        }

        function validateNewPassword() {
            const val = newPasswordInput.value;
            const errElem = document.getElementById('error-new_password');
            const passRegex = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/;
            if (!val) {
                newPasswordInput.classList.add('is-invalid-field');
                newPasswordInput.classList.remove('is-valid-field');
                errElem.textContent = 'New password is required.';
                return false;
            } else if (!passRegex.test(val)) {
                newPasswordInput.classList.add('is-invalid-field');
                newPasswordInput.classList.remove('is-valid-field');
                errElem.textContent = 'Min 6 chars with at least 1 letter and 1 number.';
                return false;
            } else {
                newPasswordInput.classList.remove('is-invalid-field');
                newPasswordInput.classList.add('is-valid-field');
                errElem.textContent = '';
                return true;
            }
        }

        function validateConfirmPassword() {
            const val = confirmPasswordInput.value;
            const passVal = newPasswordInput.value;
            const errElem = document.getElementById('error-confirm_password');
            if (!val) {
                confirmPasswordInput.classList.add('is-invalid-field');
                confirmPasswordInput.classList.remove('is-valid-field');
                errElem.textContent = 'Please confirm your new password.';
                return false;
            } else if (val !== passVal) {
                confirmPasswordInput.classList.add('is-invalid-field');
                confirmPasswordInput.classList.remove('is-valid-field');
                errElem.textContent = 'Passwords do not match.';
                return false;
            } else {
                confirmPasswordInput.classList.remove('is-invalid-field');
                confirmPasswordInput.classList.add('is-valid-field');
                errElem.textContent = '';
                return true;
            }
        }

        // Attach Real-Time Listeners
        emailInput.addEventListener('input', validateEmail);
        emailInput.addEventListener('blur', validateEmail);

        newPasswordInput.addEventListener('input', () => {
            validateNewPassword();
            if (confirmPasswordInput.value) validateConfirmPassword();
        });
        newPasswordInput.addEventListener('blur', validateNewPassword);

        confirmPasswordInput.addEventListener('input', validateConfirmPassword);
        confirmPasswordInput.addEventListener('blur', validateConfirmPassword);

        // AJAX Form Submit Handling
        document.getElementById('forgot-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const alertErr = document.getElementById('forgot-error-alert');
            const alertSucc = document.getElementById('forgot-success-alert');
            alertErr.style.display = 'none';
            alertSucc.style.display = 'none';

            const isV1 = validateEmail();
            const isV2 = validateNewPassword();
            const isV3 = validateConfirmPassword();

            if (!isV1 || !isV2 || !isV3) {
                alertErr.textContent = 'Please fix validation errors before resetting.';
                alertErr.style.display = 'block';
                return;
            }

            const formData = new FormData(this);

            fetch('/accounts/forgot-password/', {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alertSucc.textContent = data.message;
                    alertSucc.style.display = 'block';
                    if (data.redirect_url) {
                        setTimeout(() => {
                            window.location.href = data.redirect_url;
                        }, 1800);
                    }
                } else {
                    alertErr.textContent = data.message || 'Password reset failed. Please check inputs.';
                    alertErr.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alertErr.textContent = 'An error occurred during password reset. Please try again.';
                alertErr.style.display = 'block';
            });
        });
    </script>
</body>
</html>
